# Sanal tahta: Atlas'ı Debian 12'de (Pardus 23'ün temeli) gerçek Qt ile açar; tarayıcıdan noVNC ile kullanılır.
# Okul verisi yok: Supabase okul çağrıları ve Drive ayarı devre dışı; yalnız "Atlas'a sor" DENEME sınıfıyla çalışır.
name: Sanal tahta önizleme
on:
  push:
    branches: [sanal-onizleme]
  workflow_dispatch:
    inputs:
      sure:
        description: "Açık kalma süresi (dakika)"
        default: "180"
permissions: { contents: write }
concurrency: { group: sanal-onizleme, cancel-in-progress: true }
jobs:
  tahta:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Kurulum
        env: { DEBIAN_FRONTEND: noninteractive }
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ./umal-tahta_*_amd64.deb xvfb x11vnc novnc python3-websockify openbox curl ca-certificates xdotool \
            fonts-dejavu locales imagemagick x11-utils dbus-x11 libgl1 libegl1 git openssl >/dev/null
          sed -i 's/^# *tr_TR.UTF-8/tr_TR.UTF-8/' /etc/locale.gen && locale-gen >/dev/null
      - name: Okul verisini kapat
        run: |
          rm -f /usr/share/tahta-kalem/havuz/rclone.conf
          python3 - <<'PY'
          p = '/usr/lib/umal-tahta/umal-havuz'; s = open(p, encoding='utf-8').read()
          s = s.replace('def yonetim(fonksiyon, govde, timeout=60):\n', 'def yonetim(fonksiyon, govde, timeout=60):\n    raise RuntimeError("sanal tahta: okul verisi kapalı")\n', 1)
          s = s.replace('def indir(adres, hedef, timeout=900):\n', 'def indir(adres, hedef, timeout=900):\n    raise RuntimeError("sanal tahta: indirme kapalı")\n', 1)
          s = s.replace("    veri['anahtar'] = YONETIM_ANAHTAR\n", "    veri['anahtar'] = YONETIM_ANAHTAR; veri['sinif'] = 'DENEME'\n", 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -c "sanal tahta" /usr/lib/umal-tahta/umal-havuz
          mkdir -p /root/.local/share/umal-tahta && echo '{"sinif": "9-A"}' > /root/.local/share/umal-tahta/tahta.json
      - name: Cozum alani
        run: |
          mkdir -p /tmp/onizleme
          export LANG=tr_TR.UTF-8 LC_ALL=tr_TR.UTF-8 TZ=Europe/Istanbul QT_X11_NO_MITSHM=1 PYTHONPATH=/usr/lib/umal-tahta/python
          Xvfb :7 -screen 0 1920x1080x24 -nolisten tcp >/dev/null 2>&1 & sleep 2; DISPLAY=:7 openbox >/dev/null 2>&1 & sleep 1
          : > /tmp/olcum.txt; rm -f /tmp/onizleme/*.png; mkdir -p /tmp/onizleme
          cp yeni.py /usr/share/tahta-kalem/tahta_kalem.py; rm -rf /usr/share/tahta-kalem/__pycache__; cp ornek.docx /tmp/ornek.docx
          k=0; DISPLAY=:7 timeout 60 python3 -u ultra_t.py > /tmp/h.txt 2>&1 || k=$?
          echo "ultra çıkış $k" >> /tmp/olcum.txt; (grep -v "XDG\|libEGL\|MESA\|dri" /tmp/h.txt || true) | tail -20 >> /tmp/olcum.txt
          (cd /tmp/onizleme && pdftoppm -r 50 -png ornek-docx.pdf u-docx 2>/dev/null || (apt-get install -y -qq poppler-utils >/dev/null && pdftoppm -r 50 -png ornek-docx.pdf u-docx)) || true
          for s in "Öğretmenler odası" "9-A"; do
            rm -rf /root/.local/share/umal-tahta; mkdir -p /root/.local/share/umal-tahta; printf '{"sinif": "%s"}' "$s" > /root/.local/share/umal-tahta/tahta.json
            k=0; DISPLAY=:7 timeout 80 python3 -u /usr/share/tahta-kalem/tahta_kalem.py > /tmp/a.txt 2>&1 || k=$?
            echo "== $s: çıkış kodu $k (124 = açık kaldı)" >> /tmp/olcum.txt
            (grep -n "Traceback\|Error\|hata\|Segmentation\|Abort" /tmp/a.txt || true) | grep -v "XDG\|libEGL\|MESA\|dri" | head -15 >> /tmp/olcum.txt
          done
          cat /tmp/olcum.txt
      - name: Durumu yaz
        run: |
          mkdir -p /tmp/durum && cd /tmp/durum && git init -q -b sanal-onizleme-durum
          cp /tmp/ilk.png /tmp/onizleme-yazi.png /tmp/onizleme/*.png . 2>/dev/null || true; cp /tmp/iz.out iz.txt 2>/dev/null || true; cp /tmp/olcum.txt /tmp/olcum-hata.txt . 2>/dev/null || true; tail -40 /tmp/tahta.log > tahta.log 2>/dev/null || true
          cp /tmp/onizleme-log.txt . 2>/dev/null || true; date -u +%FT%TZ > zaman.txt
          git add -A && git -c user.name=sanal-tahta -c user.email=sanal@umal.invalid commit -qm "sanal tahta durumu"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:sanal-onizleme-durum
